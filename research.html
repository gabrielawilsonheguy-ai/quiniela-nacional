<style>
:root{--navy:#1B2A4A;--gold:#C9A84C;--bg:#E8E6DF;--card:#F5F3EE;--line:#D8D4C8;--red:#B03A2E;--ok:#2E7D4F;--gris:#8b93a6;--amb:#c9922e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:6px 14px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px}
h1{font:700 17px Georgia,serif;margin:0}header small{color:#cfd6e6;font-size:11px}
.wrap{padding:10px 12px;max-width:1100px;margin:0 auto}
.btn{border:1px solid var(--navy);background:var(--card);color:var(--navy);padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
header .btn{margin-left:auto}.btn.on{background:var(--navy);color:#fff}
.tur{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.tur .btn small{font-size:10px;opacity:.7}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.sec h2{font:700 18px Georgia,serif;margin:0 0 2px}
.sec .q{font-size:13px;color:#555;margin:0 0 10px}
.dec{font-size:15px;line-height:1.5;background:#fff;border-left:5px solid var(--gold);padding:8px 12px;margin:10px 0 0;border-radius:4px}
.dec b{color:var(--navy)}
.stk{display:flex;height:46px;border-radius:7px;overflow:hidden;border:1px solid #b9b4a4;background:#fff;margin:4px 0}
.stk>div{min-width:3px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;line-height:1.1}.stk>div b{font-size:15px}.stk>div small{font-size:11px;font-weight:700}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 12px;font-size:13px}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:13px;height:13px;border-radius:3px;display:inline-block}
.leg b{font-size:15px}.leg em{font-style:normal;color:#555;font-size:13px}
.lbl{font-size:13px;font-weight:700;margin:12px 0 2px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0}.kpi>div{flex:1 1 200px;background:#fff;border:2px solid var(--gold);border-radius:10px;padding:9px 12px}
.kpi b{display:block;font:700 30px Georgia,serif;line-height:1.1}.kpi span{font-size:13px;font-weight:700}.kpi small{display:block;font-size:12px;color:#555;margin-top:2px}
.kpi .ok{border-color:var(--ok)}.kpi .ok b{color:var(--ok)}.kpi .ro{border-color:var(--red)}.kpi .ro b{color:var(--red)}
.hist{display:flex;align-items:flex-end;gap:6px;height:240px;margin:14px 0 4px;padding:0 2px}
.hist .c{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.hist .c .bar{width:100%;border-radius:5px 5px 0 0;min-height:3px}
.hist .c .v{font-size:12px;font-weight:700;margin-bottom:2px;text-align:center;line-height:1.15}
.hist .c .v small{display:block;font-weight:400;color:#555;font-size:11px}
.eje{display:flex;gap:6px;border-top:2px solid var(--navy);padding-top:4px}
.eje>div{flex:1 1 0;text-align:center;font-size:12px;line-height:1.2;min-width:0}
.zonas{display:flex;gap:6px;margin-top:4px;font-size:12px;font-weight:700}
.zonas>div{text-align:center;border-radius:5px;padding:3px 2px}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;text-align:center;font-size:13px;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px}thead th{background:var(--navy);color:#fff;font-size:12px}
td.n{text-align:left;font-weight:700;white-space:nowrap}tr.tot td{background:var(--gold);font-weight:700}
.ad{font-size:12px;color:#8a5a00;background:#fff4d6;border:1px solid #ecd48a;border-radius:6px;padding:2px 7px;display:inline-block;margin-left:6px}
.eq{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.eq>div{flex:1 1 160px;max-width:260px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;text-align:center}.eq>i{align-self:center;font:700 26px Georgia,serif;font-style:normal}
.eq span{display:block;font-size:12px;font-weight:700}.eq b{display:block;font:700 28px Georgia,serif}.eq small{font-size:11px;color:#555}.eq .e0{background:var(--navy);color:#fff;border-color:var(--navy)}.eq .e0 span,.eq .e0 b,.eq .e0 small{color:#fff}.eq .e1{border-color:#5b6b8c}.eq .e2{border-color:var(--gold)}.eq .sel{border-width:5px}
.etp{display:flex;align-items:stretch;gap:6px;margin:8px 0}.etp>div{flex:1 1 0;border:3px solid;border-radius:10px;padding:8px 6px;text-align:center;min-width:0}.etp i{align-self:center;font:700 24px Georgia,serif;font-style:normal}
.etp span{display:block;font-size:12px;font-weight:700}.etp b{display:block;font:700 26px Georgia,serif;margin:2px 0}.etp small{font-size:11px;color:#555}.etp em{display:block;font-style:normal;font-weight:700;font-size:13px;margin-top:2px}
@media(max-width:700px){.etp{flex-wrap:wrap}.etp>i{display:none}.etp>div{flex:1 1 30%}}
.met{margin:10px 0 0;font-size:12px;color:#444;line-height:1.6}
.vac{padding:20px;text-align:center;color:#666}
.pos{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-size:12px;text-align:center}.pos div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px}
.pos small{display:block;color:#777;font-size:10px}
</style></head><body>
<header><div><h1>Research · Qué está pasando con los ciclos</h1><small>Quiniela Nacional · solo observar y juntar datos (las reglas no se tocan)</small></div><a class="btn" href="jugadas.html">‹ Jugadas</a><a class="btn" href="index.html" style="margin-left:6px">‹ Inicio</a></header>
<div class="wrap">
 <div class="tur" id="tur"></div>
 <div id="est" style="font-size:12px;color:#555;margin-bottom:8px"></div>
 <div id="cont"></div>
</div>
<script src="nac-core.js"></script>
<script>
const $=id=>document.getElementById(id);let TS=[],SEL="todos";
const FK="lw:nac-res-fotos-v1";
const pc=(a,b)=>{if(!b)return"–";const p=100*a/b;return(p<10&&p>0?p.toFixed(1).replace(".",","):Math.round(p))+" %"};
const nf=x=>Math.round(x).toLocaleString("es-AR");
const ch=n=>n<30?`<span class="ad">⚠ pocos casos (n = ${n}): no sacar conclusiones todavía</span>`:"";
// Categorías de la distribución respecto de la ventana
const BINS=[
 {k:"a3",t:"Más de 10 sorteos antes",c:"#6b7690",z:"antes"},
 {k:"a2",t:"6 a 10 antes",c:"#8b93a6",z:"antes"},
 {k:"a1",t:"1 a 5 antes",c:"#c9922e",z:"antes"},
 {k:"in",t:"DENTRO de la ventana",c:"#2E7D4F",z:"dentro"},
 {k:"d1",t:"1 a 5 después",c:"#d98a7e",z:"despues"},
 {k:"d2",t:"6 a 10 después",c:"#c4584a",z:"despues"},
 {k:"d3",t:"Más de 10 después",c:"#a03a2f",z:"despues"},
 {k:"nx",t:"Pasó la ventana y todavía no salió",c:"#7a2a22",z:"despues"}];
function bin(K){ // K cerrado, n9, no descartado, con ventana
 if(K.e==="supera"&&K.Ys==null)return"nx";
 const d=K.Ys-K.v1;
 if(d<=-11)return"a3";if(d<=-6)return"a2";if(d<0)return"a1";if(d<=10)return"in";
 const e=K.Ys-K.v2;if(e<=5)return"d1";if(e<=10)return"d2";return"d3"}
const MOT=[
 {k:"b2",t:"β llegó a 2 o más",c:"#B03A2E"},
 {k:"a2",t:"α llegó a 2 o más",c:"#d9774a"},
 {k:"b1",t:"β menor que 1",c:"#8a3a8a"},
 {k:"d8",t:"8 distintos en los 8 primeros sorteos",c:"#4a6fa5"},
 {k:"d5",t:"5 distintos en los 5 primeros sorteos",c:"#2f8f8f"},
 {k:"ot",t:"Otro motivo",c:"#777"}];
function mot(K){const t=K.txt||"";
 if(/^β.*2/.test(t))return"b2";if(/^α.*2/.test(t))return"a2";if(/menor que 1/.test(t))return"b1";
 if(/^8 distintos/.test(t))return"d8";if(/^5 distintos/.test(t))return"d5";return"ot"}
function nuevo(){const o={arr:0,term:0,curso9:0,curso0:0,espera:0,vent:0,sinYm:0,pas:0,e1:0,e2:0,e3:0,no9:0,desc:0,rg:{},antes:0,sinY:0,lleg:0,acierto:0,supera:0,
 bins:{},p100:0,gan:0,per:0,jug:0,posv:Array(11).fill(0),pu:Array(20).fill(0),pd:Array(20).fill(0)};BINS.forEach(b=>o.bins[b.k]=0);return o}
function contar(turno){const o=nuevo();
 for(const f of["u","d"])for(let i=0;i<20;i++){const s=LN.sim(turno.data,i,f);
  for(const K of s.casos){o.arr++;(f==="u"?o.pu:o.pd)[i]++;if(K.p100)o.p100++;
   const abierto=(K.e==="juntando"||K.e==="espera"||K.e==="ventana");
   if(K.e==="desc"){o.term++;o.desc++;{const m=mot(K);o.rg[m]=(o.rg[m]||0)+1};continue}
   if(K.e==="sin9"){o.term++;o.no9++;continue}
   if(abierto){if(K.e==="espera"){o.curso9++;o.espera++;const f=K.v1-K.Yact;if(f>10)o.e1++;else if(f>5)o.e2++;else o.e3++}
    else if(K.e==="ventana"){o.curso9++;if(K.v2!=null&&K.Yact>K.v2)o.pas++;else o.vent++}
    else if((K.nd||0)>=9){o.curso9++;o.sinYm++}else o.curso0++;continue}
   if(K.e==="supera"&&K.Ys==null){o.curso9++;o.pas++;if(K.c&&K.c.A){const ap=LN.apuesta(K.c.A,K.c.A.v2,null);o.per+=ap.tot;o.jug++}continue}
   // terminado con 9/10
   o.term++;
   if(K.e==="antes"||K.e==="acierto"||K.e==="supera"){
    if(K.e==="antes")o.antes++;
    if(K.e==="acierto"){o.acierto++;o.lleg++}
    if(K.e==="supera"){o.supera++;o.lleg++}
    if(K.v1===undefined||K.v1===null){o.sinY++;continue}
    o.bins[bin(K)]++;
    if(K.e==="acierto"&&K.c){const ap=LN.apuesta(K.c.A,K.c.Ys,K.c.Ys);o.gan+=ap.premio;o.per+=ap.tot;o.jug++;const p=K.c.Ys-K.c.A.v1;if(p>=0&&p<11)o.posv[p]++}
    if(K.e==="supera"&&K.c){const ap=LN.apuesta(K.c.A,K.c.A.v2,null);o.per+=ap.tot;o.jug++}}}}
 return o}
const sumar=a=>a.reduce((r,x)=>{for(const k in x){if(k==="bins"||k==="rg"){for(const g in x[k])r[k][g]=(r[k][g]||0)+x[k][g]}
 else if(Array.isArray(x[k]))x[k].forEach((v,j)=>r[k][j]=(r[k][j]||0)+v);else r[k]=(r[k]||0)+x[k]}return r},{bins:{},rg:{},posv:Array(11).fill(0),pu:Array(20).fill(0),pd:Array(20).fill(0)});
function txc(c){const n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?"#1B2A4A":"#fff"}
function pila(parts){const tot=parts.reduce((s,p)=>s+p.n,0)||1;
 return `<div class="stk">${parts.map(p=>`<div style="width:${100*p.n/tot}%;background:${p.c};color:${txc(p.c)}" title="${p.t}: ${nf(p.n)} (${pc(p.n,tot)})">${100*p.n/tot>=9?`<b>${nf(p.n)}</b><small>${pc(p.n,tot)}</small>`:""}</div>`).join("")}</div><div class="leg">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.t}: <b>${nf(p.n)}</b> <em>· ${pc(p.n,tot)}</em></span>`).join("")}</div>`}
function seccionBase(C,tot,o){
 const rows=C.map(x=>{const n=x.t.data.length,d0=x.t.data[0],d1=x.t.data[n-1];return {n,nom:x.t.nombre,id:x.t.id,hora:x.t.hora,d:LN.fmt(d0.k),h:LN.fmt(d1.k),u:n*20,de:n*20,t:n*40,ci:x.o.arr}});
 const S=rows.reduce((a,r)=>({n:a.n+r.n,u:a.u+r.u,de:a.de+r.de,t:a.t+r.t,ci:a.ci+r.ci}),{n:0,u:0,de:0,t:0,ci:0});
 return `<div class="sec"><h2>1 · Base analizada y ciclos totales</h2><p class="q">Los datos salen de las <b>5 loterías de la Quiniela Nacional</b>. En cada sorteo salen 20 números (posiciones 01 a 20) y de cada uno se toma la cifra de las <b>Unidades</b> y la de las <b>Decenas</b>.</p>
 <div class="tw"><table><thead><tr><th>Lotería</th><th>Sorteos</th><th>Desde</th><th>Hasta</th><th>Dígitos de Unidades</th><th>Dígitos de Decenas</th><th>Total de dígitos</th><th>Ciclos detectados</th></tr></thead><tbody>${rows.map(r=>`<tr${SEL===r.id?' style="background:#fff4d6"':''}><td class="n">${r.nom} <small>${r.hora}</small></td><td>${nf(r.n)}</td><td>${r.d}</td><td>${r.h}</td><td>${nf(r.u)}</td><td>${nf(r.de)}</td><td>${nf(r.t)}</td><td>${nf(r.ci)}</td></tr>`).join("")}<tr class="tot"><td class="n">TOTAL</td><td>${nf(S.n)}</td><td></td><td></td><td>${nf(S.u)}</td><td>${nf(S.de)}</td><td>${nf(S.t)}</td><td>${nf(S.ci)}</td></tr></tbody></table></div>
 <div class="lbl">Composición de los ciclos totales${SEL==="todos"?"":" · "+(C.find(x=>x.t.id===SEL)||{t:{nombre:""}}).t.nombre}</div>
 ${resumen(o,"")}
 <div class="dec">Cuenta: <b>sorteos × 20 posiciones</b> = dígitos de Unidades (y lo mismo para Decenas). Sobre estos <b>${nf(S.t)} dígitos</b> se detectaron <b>${nf(S.ci)} ciclos</b>.</div></div>`}
function resumen(o,sel){const curso=o.curso9+o.curso0;
 return `<div class="sec" style="background:transparent;border:0;padding:0 0 4px"><div class="eq"><div class="e0"><span>CICLOS TOTALES</span><b>${nf(o.arr)}</b><small>desde jun 2026</small></div><i>=</i><div class="e1 ${sel==="c"?"sel":""}"><span>CERRADOS</span><b>${nf(o.term)}</b><small>ya terminaron</small></div><i>+</i><div class="e2 ${sel==="e"?"sel":""}"><span>EN CARRERA</span><b>${nf(curso)}</b><small>siguen jugando</small></div></div></div>`}
function seccionCerrados(o){
 const salio=o.no9+o.antes+o.lleg,base=o.term-o.no9;
 return `<div class="sec"><h2>2 · Ciclos cerrados: cómo terminaron los que ya terminaron</h2><p class="q">Un ciclo se cierra de dos maneras: <b>una regla lo descarta</b> o <b>sale el dígito</b>.</p>
 <div class="eq"><div class="e1 sel"><span>CICLOS CERRADOS</span><b>${nf(o.term)}</b><small>${pc(o.term,o.arr)} de los ciclos totales</small></div></div>
 <div class="lbl">¿Por qué se cerraron?</div>
 ${pila([{n:o.desc,t:"Cerrados POR REGLA (lo descartó una regla)",c:"#B03A2E"},{n:salio,t:"Cerrados porque SALIÓ el dígito",c:"#5b6b8c"}])}
 <div class="lbl">Los cerrados POR REGLA: ¿qué regla fue?</div>
 ${o.desc?pila(MOT.filter(m=>o.rg[m.k]).map(m=>({n:o.rg[m.k],t:m.t,c:m.c}))):'<div class="met">Ningún ciclo descartado.</div>'}
 <div class="lbl">Los cerrados porque SALIÓ el dígito: ¿en qué etapa salió?</div>
 ${pila([{n:o.no9,t:"Antes de llegar a 9/10",c:"#b9b4a4"},{n:o.antes,t:"En 9/10, antes de la ventana (nunca se jugó)",c:"#5b6b8c"},{n:o.acierto,t:"En la ventana: salió DENTRO (acierto)",c:"#2E7D4F"},{n:o.supera,t:"En la ventana: salió DESPUÉS (falla)",c:"#d9774a"}])}
 <div class="dec">De cada <b>100 cerrados</b> que llegaron a 9/10, <b>${pc(o.antes,base)}</b> salieron antes de llegar a la ventana, <b>${pc(o.desc,base)}</b> los descartó una regla y <b>${pc(o.lleg,base)}</b> llegaron a la ventana. ${ch(base)}</div></div>`}
function seccionCarrera(o){
 const curso=o.curso9+o.curso0;
 const et=[["8/10 o menos","todavía juntando",o.curso0,"#e8e5da","#9a9484"],["Más de 10 sorteos","antes de Y mín",o.e1,"#fbf1d3","#C9A84C"],["6 a 10 sorteos","antes de Y mín",o.e2,"#fbf1d3","#C9A84C"],["1 a 5 sorteos","antes de Y mín",o.e3,"#f7e6b0","#C9A84C"],["En la VENTANA","entre Y mín e Y máx",o.vent,"#dff0e6","#2E7D4F"],["Pasó Y máx","todavía no salió",o.pas,"#f6dcd8","#B03A2E"]];
 return `<div class="sec"><h2>3 · Ciclos en carrera: dónde está hoy cada ciclo que sigue jugando</h2><p class="q">Todavía no terminaron: el dígito no salió y ninguna regla los descartó. Avanzan de izquierda a derecha, un sorteo por vez.</p>
 <div class="eq"><div class="e2 sel"><span>CICLOS EN CARRERA</span><b>${nf(curso)}</b><small>${pc(curso,o.arr)} de los ciclos totales</small></div></div>
 <div class="etp">${et.map((e,i)=>`${i?'<i>›</i>':''}<div style="background:${e[3]};border-color:${e[4]}"><span>${e[0]}</span><b>${nf(e[2])}</b><small>${e[1]}</small><em>${pc(e[2],curso)}</em></div>`).join("")}</div>
 <div class="met" style="margin:4px 0 8px"><b>8/10 o menos</b>: todavía no salieron 9 números distintos · <b>desde "más de 10 sorteos"</b>: ya están en 9/10 y tienen Y mín e Y máx.</div>
 ${o.sinYm?`<div class="ad" style="margin:4px 0">⚠ ${nf(o.sinYm)} ciclos en 9/10 sin Y mín (revisar, no debería pasar)</div>`:""}
 <div class="dec">Hoy hay <b>${nf(curso)}</b> ciclos en carrera. <b>${nf(o.e3+o.e2)}</b> están a 10 sorteos o menos de Y mín, <b>${nf(o.vent)}</b> están en la ventana y <b>${nf(o.pas)}</b> ya pasaron Y máx sin salir.</div></div>`}
function hist(o,L,alt){
 const n=BINS.reduce((s,b)=>s+o.bins[b.k],0),mx=Math.max(1,...L.map(b=>o.bins[b.k]));
 const zona={antes:"#eef0f5",dentro:"#dff0e6",despues:"#f7e3df"};
 const cols=L.map(b=>{const v=o.bins[b.k];return `<div class="c"><div class="v">${nf(v)}<small>${pc(v,n)}</small></div><div class="bar" style="height:${Math.max(1,(alt-70)*v/mx)}px;background:${b.c}"></div></div>`}).join("");
 const eje=L.map(b=>`<div><b>${b.t}</b></div>`).join("");
 const na=L.filter(b=>b.z==="antes").length,nd=L.filter(b=>b.z==="despues").length;
 return `<div class="hist" style="height:${alt}px">${cols}</div><div class="eje">${eje}</div>
 <div class="zonas"><div style="flex:${na};background:${zona.antes}">◀ ANTES de la ventana</div><div style="flex:1;background:${zona.dentro};color:#2E7D4F">VENTANA</div><div style="flex:${nd};background:${zona.despues}">DESPUÉS ▶</div></div>`}
function seccion2(o){
 const n=BINS.reduce((s,b)=>s+o.bins[b.k],0);
 const cerca=o.bins.a1+o.bins.in+o.bins.d1,cerca10=o.bins.a2+o.bins.a1+o.bins.in+o.bins.d1+o.bins.d2;
 const zoom=BINS.filter(b=>b.k!=="a3");
 return `<div class="sec"><h2>4 · ¿Dónde sale el dígito respecto de la ventana?</h2><p class="q">Cada ciclo terminado en 9/10 tenía una ventana proyectada (Y mín a Y máx). Acá se ve en qué sorteo salió realmente, comparado con esa ventana.</p>
 <div class="lbl">Todos los ciclos</div>${hist(o,BINS,230)}
 <div class="lbl">Zoom: solo los que están cerca de la ventana (sin los que salen a más de 10 sorteos antes)</div>${hist(o,zoom,200)}
 <div class="dec"><b>Exacto (dentro de la ventana):</b> ${nf(o.bins.in)} de ${nf(n)} (${pc(o.bins.in,n)}).<br><b>Cerquita (hasta 5 sorteos antes o después, o dentro):</b> ${nf(cerca)} de ${nf(n)} (${pc(cerca,n)}).<br><b>Hasta 10 sorteos antes o después, o dentro:</b> ${nf(cerca10)} de ${nf(n)} (${pc(cerca10,n)}). ${ch(n)}</div>
 <div class="met" style="margin-top:6px">No entran acá: ${nf(o.sinY)} ciclos que salieron antes de que se pudiera calcular Y mín, ${nf(o.desc)} descartados por regla y ${nf(o.curso9)} que todavía están en carrera.</div></div>`}
function seccion3(o){const n=BINS.reduce((s,b)=>s+o.bins[b.k],0);
 return `<div class="sec"><h2>5 · ¿Con qué frecuencia llegan a la ventana?</h2><p class="q">Y cuántos salen justo antes de empezar (5 o 10 sorteos antes de Y mín).</p>
 <div class="kpi"><div class="ok"><span>Llegan a la ventana</span><b>${nf(o.lleg)}</b><small>${pc(o.lleg,n)} de ${nf(n)} ciclos terminados en 9/10</small></div><div><span>Salen de 1 a 5 sorteos antes</span><b>${nf(o.bins.a1)}</b><small>${pc(o.bins.a1,n)} · entrando 5 antes se ve este grupo</small></div><div><span>Salen de 6 a 10 sorteos antes</span><b>${nf(o.bins.a2)}</b><small>${pc(o.bins.a2,n)}</small></div><div><span>Salen hasta 10 antes (suma)</span><b>${nf(o.bins.a1+o.bins.a2)}</b><small>${pc(o.bins.a1+o.bins.a2,n)}</small></div></div>${ch(n)}</div>`}
const STK=LN.STK,PAGA=LN.PAGA;
function seccion4(o){
 const neto=o.gan-o.per;
 const nk=STK.map((_,k)=>PAGA*STK[k]-STK.slice(0,k+1).reduce((a,b)=>a+b,0)),perd=STK.reduce((a,b)=>a+b,0);
 const pmin=perd/(perd+Math.max(...nk)),pmax=perd/(perd+Math.min(...nk));
 return `<div class="sec"><h2>6 · ¿Y en plata?</h2><p class="q">Solo cuentan las jugadas reales: ciclos que llegaron a la ventana y apostaron (tabla de apuestas).</p>
 <div class="kpi"><div><span>Jugadas terminadas</span><b>${nf(o.jug)}</b><small>${nf(o.acierto)} acertaron · ${nf(o.supera)} fallaron</small></div><div class="ro"><span>PERDIDO (apostado)</span><b>$ ${nf(o.per)}</b></div><div class="ok"><span>GANADO</span><b>$ ${nf(o.gan)}</b><small>7 × lo apostado en el sorteo que salió</small></div><div class="${neto>=0?"ok":"ro"}"><span>NETO</span><b>${neto<0?"−":""}$ ${nf(Math.abs(neto))}</b><small>GANADO − PERDIDO</small></div></div>
 <div class="dec">Si una ventana falla se pierden <b>$ ${nf(perd)}</b>. Si sale, la ganancia limpia va de <b>$ ${nf(Math.min(...nk))}</b> (sale en el último sorteo) a <b>$ ${nf(Math.max(...nk))}</b>. Para no perder plata hay que acertar entre el <b>${Math.round(pmin*100)} %</b> y el <b>${Math.round(pmax*100)} %</b> de las jugadas.${o.jug?` Hasta hoy: <b>${pc(o.acierto,o.jug)}</b> (${nf(o.acierto)} de ${nf(o.jug)}).`:""} ${ch(o.jug)}</div></div>`}
function seccion5(C,tot){
 const fila=(n,o,cl)=>{const rg=MOT.filter(m=>o.rg[m.k]).map(m=>m.t.replace(" o más","").replace(" en los 8 primeros sorteos"," en 8").replace(" en los 5 primeros sorteos"," en 5")+": "+o.rg[m.k]).join(" · ")||"–";return `<tr class="${cl||""}"><td class="n">${n}</td><td>${nf(o.arr)}</td><td>${nf(o.term)}</td><td>${nf(o.curso9+o.curso0)}</td><td>${nf(o.desc)}<br><small>${rg}</small></td><td>${nf(o.lleg)}</td><td>${nf(o.p100)}</td></tr>`};
 const pos=(a,l)=>`<div class="lbl">${l}</div><div class="pos">${a.map((v,i)=>`<div><small>${String(i+1).padStart(2,"0")}</small><b>${v}</b></div>`).join("")}</div>`;
 const R=LN.reglas;
 return `<div class="sec"><h2>7 · Control de los datos</h2><p class="q">Para saber cuánto confiar en los números de arriba.</p>
 <div class="tw"><table><thead><tr><th>Turno</th><th>Ciclos totales</th><th>Terminados</th><th>En carrera</th><th>Descartados</th><th>Llegaron a la ventana</th><th>Pasaron el sorteo 100</th></tr></thead><tbody>${C.map(x=>fila(x.t.nombre,x.o)).join("")}${fila("TOTAL",tot,"tot")}</tbody></table></div>
 ${pos(tot.pu,"Ciclos por posición · Unidades")}${pos(tot.pd,"Ciclos por posición · Decenas")}
 <div class="lbl">Reglas con las que se midió</div><div class="met" style="margin-top:2px">Entrada a Análisis: <b>${R.ent}</b> · regla de 5 distintos: <b>${R.r3?"activada":"apagada"}</b> · se anula si α o β llegan a 2 · Y máx tope 100.</div>
 <div class="lbl">Fotos mensuales</div><div style="margin:4px 0"><button class="btn" id="foto">📸 Guardar foto de hoy</button></div><div id="fotos"></div></div>`}
function fotos(tot){let F=[];try{F=JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){}
 const n=BINS.reduce((s,b)=>s+tot.bins[b.k],0);
 $("foto").onclick=()=>{F.push({f:new Date().toLocaleDateString("es-AR"),arr:tot.arr,term:tot.term,curso:tot.curso9+tot.curso0,lleg:tot.lleg,dentro:tot.bins.in,n,a1:tot.bins.a1,a2:tot.bins.a2,neto:tot.gan-tot.per,r:LN.reglas.ent+(LN.reglas.r3?"+5":"")});try{localStorage.setItem(FK,JSON.stringify(F))}catch(e){}fotos(tot)};
 $("fotos").innerHTML=F.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Ciclos</th><th>Terminados</th><th>En carrera</th><th>Llegaron</th><th>Dentro</th><th>1-5 antes</th><th>6-10 antes</th><th>Neto</th><th>Reglas</th></tr></thead><tbody>${F.map(x=>`<tr><td>${x.f}</td><td>${nf(x.arr)}</td><td>${nf(x.term)}</td><td>${nf(x.curso)}</td><td>${x.lleg}</td><td>${x.dentro} de ${x.n}</td><td>${x.a1}</td><td>${x.a2}</td><td>${nf(x.neto)}</td><td>${x.r}</td></tr>`).join("")}</tbody></table></div><div class="met">Las fotos se guardan solo en este aparato.</div>`:'<div class="met">Todavía no hay fotos. Guardá una por mes para ver cómo evoluciona.</div>'}
function render(){
 if(!TS.length){$("cont").innerHTML='<div class="vac">No hay datos.</div>';return}
 const C=TS.map(t=>({t,o:contar(t)})),tot=sumar(C.map(x=>x.o));
 const o=SEL==="todos"?tot:C.find(x=>x.t.id===SEL).o;
 $("cont").innerHTML=seccionBase(C,tot,o)+seccionCerrados(o)+seccionCarrera(o)+seccion2(o)+seccion3(o)+seccion4(o)+seccion5(C,tot)+'<div class="met"><b>Cómo se lee.</b> Un <b>ciclo</b> empieza cuando un dígito pasa a ser el que más hace que no sale (en cada posición, Unidades y Decenas, de cada turno) y termina cuando sale. <b>9/10</b> = ya salieron 9 números distintos. Ahí se calculan Y mín e Y máx y se espera la <b>ventana</b> (11 sorteos, de Y mín a Y máx). Los porcentajes se calculan solo sobre ciclos <b>terminados</b>.</div>';
 fotos(tot)}
async function cargar(){$("est").textContent="actualizando…";const r=await LN.load();TS=r.turnos;$("est").textContent=r.msg;
 if(SEL!=="todos"&&!TS.find(t=>t.id===SEL))SEL="todos";bar();render()}
function bar(){const h=['<button class="btn'+(SEL==="todos"?" on":"")+'" data-t="todos">Todos los turnos</button>'].concat(TS.map(t=>`<button class="btn${SEL===t.id?" on":""}" data-t="${t.id}">${t.nombre}<small> ${t.hora}</small></button>`));$("tur").innerHTML=h.join("");
 $("tur").onclick=e=>{const x=e.target.closest("[data-t]");if(x){SEL=x.dataset.t;bar();render()}}}
cargar();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
